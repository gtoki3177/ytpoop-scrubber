/* 依 tasteskill 2.5（leonxlnx/taste-skill）的 system.md / motion.md：
   介面 90–95% 中性、單一強調色（只有主要按鈕實心填色）、按鈕 44px、文字不小於 13px、
   灰字 4.5:1 以上、hover 填色往墨色走 14% 並上移 1px、按下下沉 1px 並縮到 .985、無回彈曲線。
   紅色只當「錄製中」狀態的小標記。 */
:root{
  color-scheme:dark;
  --bg:#0c0d10; --surface:#14161b; --surface-2:#1b1e25; --line:#272b34; --line-strong:#3a404c;
  --text:#ebedf2; --muted:#9aa1ae; --faint:#4b515d;
  --accent:#e9a23b; --accent-ink:#1b1306; --accent-soft:rgba(233,162,59,.13);
  --rec:#ef5a5f; --stage:#08090b;
  --accent-strong:#e9a23b; --track:#646c7c; --shadow:rgba(0,0,0,.6);   /* accent-strong：焦點框、線條、文字用的強調色，對底色至少 3:1 */
  --wave:#c3c8d2; --played:#4a505c;
  --r-sm:8px; --r-md:12px; --btn-h:44px;      /* soft 半徑階：控制 8、面板 12 */
  --font:"Instrument Sans","Microsoft JhengHei UI","PingFang TC",system-ui,sans-serif;
  --mono:"Fragment Mono",ui-monospace,"Cascadia Mono",monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-io:cubic-bezier(.65,0,.35,1);
  --m-in:150ms; --m-out:120ms; --m-press:90ms; --m-slide:240ms;
}
/* 淺色：跟隨系統（除非手動選了深色），或手動選淺色。兩段的值要保持一致 */
@media (prefers-color-scheme: light){
  :root:not([data-theme=dark]){
    color-scheme:light;
    --bg:#eef0f3; --surface:#f8f9fa; --surface-2:#e8ebef; --line:#d8dce2; --line-strong:#b9c0ca;
    --text:#16181d; --muted:#545b69; --faint:#a3a9b3;
    --accent:#e39a2c; --accent-ink:#1b1306; --accent-soft:rgba(227,154,44,.16);
    --rec:#cf3a3f; --stage:#101114;
    --wave:#3a404b; --played:#b4bac4;
    --accent-strong:#9a5b00; --track:#7f8794; --shadow:rgba(0,0,0,.35);
  }
}
:root[data-theme=light]{
  color-scheme:light;
  --bg:#eef0f3; --surface:#f8f9fa; --surface-2:#e8ebef; --line:#d8dce2; --line-strong:#b9c0ca;
  --text:#16181d; --muted:#545b69; --faint:#a3a9b3;
  --accent:#e39a2c; --accent-ink:#1b1306; --accent-soft:rgba(227,154,44,.16);
  --rec:#cf3a3f; --stage:#101114;
  --wave:#3a404b; --played:#b4bac4;
  --accent-strong:#9a5b00; --track:#7f8794; --shadow:rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 var(--font);display:grid;grid-template-rows:auto 1fr auto;
  overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased}
svg.i{width:18px;height:18px;flex:none;display:block}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* 按鈕：一組主要 + 次要，44px */
.btn{font:inherit;font-size:16px;font-weight:500;color:var(--text);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--r-sm);
  height:var(--btn-h);padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap;
  transition:background-color var(--m-out) var(--ease),border-color var(--m-out) var(--ease),transform var(--m-out) var(--ease)}
.btn:hover:not(:disabled){background:color-mix(in srgb,var(--surface-2) 86%,var(--text) 14%);transition-duration:var(--m-in)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 86%,var(--accent-ink) 14%);border-color:transparent}
@media (hover:hover) and (pointer:fine){ .btn:hover:not(:disabled){transform:translateY(-1px)} }
.btn:active:not(:disabled){transform:translateY(1px) scale(.985);transition-duration:var(--m-press)}
.btn:disabled{opacity:.4;cursor:default}
.btn.icon{width:var(--btn-h);padding:0}

/* 頂列 */
header{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(max-content,1fr);align-items:center;gap:18px;padding:0 16px;height:72px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;margin:0}
.brand svg{color:var(--accent-strong);width:20px;height:20px}
.left{display:flex;align-items:center;gap:18px;min-width:0}
.file{display:flex;align-items:center;gap:10px;min-width:0}
#fname{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.transport{display:flex;align-items:center;gap:12px;flex:none}
#playBtn svg{width:16px;height:16px}
.clock{position:relative;line-height:1.2;white-space:nowrap;min-width:208px}
#clock{font-size:16px;color:var(--text)}
#clock .dur{color:var(--muted)}
#meter{position:absolute;left:0;top:100%;margin-top:3px;font-size:13px;color:var(--muted)}   /* 掛在時間下方，不影響時間的垂直置中 */
#meter.rec{color:var(--rec)} #meter.busy{color:var(--accent-strong)}
.controls{display:flex;align-items:center;gap:16px;justify-content:flex-end}
.ctl{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap}
.ctl output{color:var(--text);min-width:48px;font-size:13px}
#volOut{min-width:64px}
.ctl output.hot{color:var(--accent-strong)}   /* 音量超過檔案的最大值，會破音 */
.btn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent-strong)}
input[type=range]{width:110px;height:44px;margin:0;accent-color:var(--accent);cursor:pointer}
/* 開關：滑 16px，按住時拉長 4px（只用 transform） */
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{position:absolute;left:-3px;top:-11px;width:44px;height:44px;opacity:0;margin:0;cursor:pointer}   /* 看起來 38×22，可點範圍 44×44 */
.switch input:disabled{cursor:default}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--track);transition:background-color 180ms var(--ease);pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:999px;background:var(--text);
  transform-origin:left center;transition:transform 180ms var(--ease)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(16px);background:var(--accent-ink);transform-origin:right center}
.switch input:active:not(:disabled)+span::after{transform:scaleX(1.25);transition-duration:var(--m-press)}
.switch input:checked:active:not(:disabled)+span::after{transform:translateX(16px) scaleX(1.25)}
.switch input:disabled+span{opacity:.4}
.switch input:focus-visible+span{outline:2px solid var(--accent-strong);outline-offset:2px}
/* 分段選擇：一個指示塊靠 transform 滑到選中的那格 */
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:58px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm)}
.seg::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:58px;border-radius:calc(var(--r-sm) - 3px);background:var(--text);
  transform:translateX(calc(var(--i,1) * 100%));transition:transform var(--m-slide) var(--ease-io)}
.seg button{position:relative;font:inherit;font-size:13px;font-weight:500;color:var(--muted);background:transparent;border:0;height:36px;cursor:pointer;
  transition:color var(--m-in) var(--ease)}
.seg button::after,.dl button::after{content:"";position:absolute;left:0;right:0;top:-4px;bottom:-4px}   /* 可點範圍補到 44px 高 */
.dl button::after{top:-5px;bottom:-5px}
.seg button:hover:not(:disabled){color:var(--text)}
.seg button[aria-checked=true]{color:var(--surface)}
.seg button:disabled{cursor:default}
.seg:has(button:disabled){opacity:.5}
#recBtn svg{color:var(--rec)}

/* 主區 */
main{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:0}
#viewer{display:flex;flex-direction:column;min-width:0;min-height:0}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:var(--stage)}
#stage.hidden{display:none}
.choice{display:flex;gap:10px}
#stageCv{display:block}
#empty{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg)}
.drop{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:44px 52px;border:1px dashed var(--line-strong);border-radius:var(--r-md);
  transition:border-color var(--m-in) var(--ease),background-color var(--m-in) var(--ease);max-width:460px}
.drop>svg{width:40px;height:40px;color:var(--muted)}
.drop h2{font-size:25px;font-weight:600;letter-spacing:-.02em;margin:0}
.drop p{margin:0;color:var(--muted);font-size:16px;max-width:30ch}
.drop .err{color:var(--rec)}
body.dragover .drop{border-color:var(--accent-strong);background:var(--accent-soft)}
body.dragover .drop>svg{color:var(--accent-strong)}
.skel{width:220px;height:6px;border-radius:999px;background:linear-gradient(90deg,var(--surface-2) 0%,var(--line-strong) 50%,var(--surface-2) 100%);background-size:200% 100%}
@media (prefers-reduced-motion: no-preference){ .skel{animation:sh 1.2s linear infinite} }
@keyframes sh{to{background-position:-200% 0}}
#scrubWrap{height:210px;position:relative;border-top:1px solid var(--line);cursor:grab;touch-action:none;background:var(--surface)}
#scrubWrap.grow{flex:1;height:auto}
#scrubWrap:active{cursor:grabbing}
#scrubWrap:focus-visible{outline-offset:-2px}
#scrubCv,#ovCv{display:block;width:100%;height:100%}
#ovWrap{height:52px;border-top:1px solid var(--line);cursor:pointer;touch-action:none;background:var(--bg)}

/* 側欄：錄製 */
#side{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.side-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 12px}
.side-hd h2{font-size:20px;font-weight:600;margin:0}
.pitch{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
#noteName{font-size:25px;line-height:1}
#noteName.off{font-family:var(--font);font-size:13px;color:var(--muted)}
#noteSub{font-size:13px;color:var(--muted);min-width:118px;text-align:right}
#specCv{display:block;width:100%;height:150px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex:none}
#takes{overflow:auto;overflow-x:hidden;padding:0 12px 14px;display:flex;flex-direction:column;gap:10px}
.none{color:var(--muted);font-size:16px;padding:2px 2px;line-height:1.65}
kbd{font-family:var(--mono);font-size:13px;color:var(--text);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:0 6px}
.take{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;transition:border-color var(--m-in) var(--ease)}
.take.active{border-color:var(--accent-strong)}
.take .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px}
.take .hd b{font-weight:600;font-size:16px}
.take .hd span{color:var(--muted);font-size:13px}
.take canvas{width:100%;height:48px;display:block;margin-bottom:10px;border-radius:calc(var(--r-md) - 6px)}
.take .row{display:flex;gap:8px;align-items:center}
.take .row+.row{margin-top:8px}
.take .del{margin-left:auto}
.dl{display:flex;align-items:center;flex:1;height:var(--btn-h);padding:0 4px 0 12px;gap:2px;border:1px solid var(--line);border-radius:var(--r-sm);color:var(--muted)}
.dl>span{font-size:13px;font-weight:500;margin-right:auto;display:flex;align-items:center;gap:6px}
.dl>span svg{width:16px;height:16px}
.dl button{position:relative;font:inherit;font-size:13px;font-weight:500;color:var(--text);background:transparent;border:0;border-radius:calc(var(--r-sm) - 3px);height:34px;padding:0 10px;cursor:pointer;
  transition:background-color var(--m-out) var(--ease),transform var(--m-out) var(--ease)}
.dl button:hover:not(:disabled){background:var(--surface-2);transition-duration:var(--m-in)}
.dl button:active:not(:disabled){transform:scale(.985);transition-duration:var(--m-press)}
.dl button:disabled{opacity:.5;cursor:default}

footer{display:flex;gap:20px;align-items:center;padding:0 16px;height:45px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);background:var(--surface);white-space:nowrap;overflow:hidden}
footer kbd{margin-right:6px}
#status{margin-left:auto;color:var(--text);overflow:hidden;text-overflow:ellipsis}
.textbtn{font:inherit;font-size:13px;color:var(--muted);background:transparent;border:0;border-radius:var(--r-sm);align-self:stretch;padding:0 8px;cursor:pointer;flex:none;
  transition:color var(--m-in) var(--ease),background-color var(--m-in) var(--ease)}
.textbtn:hover{color:var(--text);background:var(--surface-2)}
/* 拖曳時鎖定滑鼠，畫一個替身游標；超出視窗左右邊緣會從另一邊繞回來（像 Blender） */
#ghost{position:fixed;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;pointer-events:none;display:none;color:var(--text);
  filter:drop-shadow(0 1px 1px var(--shadow));z-index:10}
#ghost svg{width:22px;height:22px}
body.locked #ghost{display:block}
#ghost .open,#ghost.idle .grab{display:none}
#ghost.idle .open{display:block}
#vid,.hiddenVid{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:0;top:0}

@media (max-width:1880px){ .brand span{display:none} }
/* 一列放不下時（控制區約 1090px + 播放區 270px + 開檔鈕與檔名）：上排拆成兩列，控制項可以換行，文字標籤保留 */
@media (max-width:1720px){
  header{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"left transport" "controls controls";height:auto;padding:12px 16px;row-gap:10px}
  .left{grid-area:left} .transport{grid-area:transport}
  .controls{grid-area:controls;justify-content:flex-start;flex-wrap:wrap;column-gap:28px;row-gap:6px}
  #recBtn{margin-left:auto}
  .clock{display:flex;flex-direction:column;justify-content:center;min-width:0}
  #meter{position:static;margin:0}
  #meter:empty{display:none}
}
@media (max-width:1040px){ main{grid-template-columns:minmax(0,1fr) 280px} }
/* 窄螢幕，或桌機放大到 200%：改成單欄，整頁可以捲動 */
@media (max-width:820px){
  html,body{height:auto}
  body{display:block;overflow:auto;min-height:100dvh}
  main,#viewer{display:block}
  #stage{aspect-ratio:var(--ar,16/9)}
  #stage.is-empty{aspect-ratio:auto;min-height:320px}
  #scrubWrap,#scrubWrap.grow{height:200px}
  #side{border-left:0;border-top:1px solid var(--line)}
  #takes{overflow:visible}
  .drop{padding:32px 24px;margin:0 16px}
}
@media (max-width:820px) and (min-height:700px){ header{position:sticky;top:0;z-index:5} }
@media (max-width:560px){ #fname{display:none} #openBtn .t{display:none} #openBtn{width:var(--btn-h);padding:0} .controls{column-gap:16px} }
@media (max-width:820px),(hover:none){ footer .hint{display:none} }   /* 窄螢幕或沒有鍵盤的裝置不顯示快捷鍵 */
@media (prefers-reduced-motion: reduce){
  .btn,.dl button,.switch span::after,.seg::before{transition-property:background-color,color,border-color!important}
  .btn:hover:not(:disabled),.btn:active:not(:disabled),.dl button:active:not(:disabled){transform:none}
  .btn:active:not(:disabled){filter:brightness(.9)}
}

<header>
  <div class="left">
  <h1 class="brand"><svg class="i" aria-hidden="true"><use href="#i-waveform"/></svg><span>YTPoop Scrubber</span></h1>
  <div class="file">
    <button class="btn" id="openBtn" aria-label="開啟檔案"><svg class="i" aria-hidden="true"><use href="#i-folder-open"/></svg><span class="t">開啟檔案</span></button>
    <input type="file" id="fileIn" accept="audio/*,video/*,.mkv" hidden>
    <span id="fname">尚未載入檔案</span>
  </div>
  </div>
  <div class="transport">
    <button class="btn" id="playBtn" disabled aria-label="播放" title="播放 / 暫停（空白鍵）"><svg class="i" aria-hidden="true"><use href="#i-play-fill"/></svg></button>
    <div class="clock"><div id="clock" class="mono">00:00.000 <span class="dur">/ 00:00.000</span></div><span id="meter" class="mono"></span></div>
  </div>
  <div class="controls">
    <label class="ctl"><span class="lbl">速度</span><input id="speed" type="range" min="0.1" max="2" step="0.05" value="1" aria-label="播放速度"><output id="speedOut" class="mono">1.00×</output></label>
    <div class="ctl"><span class="lbl">音量</span><input id="vol" type="range" min="-30" max="30" step="0.5" value="0" aria-label="音量" aria-valuetext="0.0 dB" title="雙擊回到 0 dB"><output id="volOut" class="mono">0.0 dB</output>
      <button class="btn" id="normBtn" disabled aria-pressed="false" title="把音量調到這個檔案不破音的最大值（最大聲的地方 -1 dB）。再按一次回到原本的音量">正規化</button></div>
    <label class="ctl" title="按住不動時，持續播放 playhead 那一瞬間的聲音"><span class="lbl">按住凍結</span><span class="switch"><input type="checkbox" id="freeze" checked aria-label="按住凍結"><span></span></span></label>
    <label class="ctl" title="開啟後像轉黑膠：速度越快音越高，倒著拖會倒放，停住就沒聲音"><span class="lbl">變調</span><span class="switch"><input type="checkbox" id="pitch" aria-label="變調"><span></span></span></label>
    <div class="ctl" title="按住凍結時重複播放的片段長度。越長越平順，越短越乾脆"><span class="lbl">重播片段</span>
      <div class="seg mono" id="grainSeg" role="radiogroup" aria-label="重播片段長度" style="--i:1">
        <button role="radio" data-v="1024" aria-checked="false">21ms</button><button role="radio" data-v="2048" aria-checked="true">43ms</button><button role="radio" data-v="4096" aria-checked="false">85ms</button>
      </div></div>
    <button class="btn" id="recBtn" disabled title="錄製（R）"><svg class="i" aria-hidden="true"><use href="#i-record-fill"/></svg><span>錄製</span></button>
  </div>
</header>
<main>
  <section id="viewer">
    <div id="stage" class="is-empty">
      <canvas id="stageCv" role="img" aria-label="影片畫面"></canvas>
      <div id="empty"><div class="drop" id="drop">
        <svg class="i" aria-hidden="true"><use href="#i-waveform"/></svg>
        <h2>拖入音訊或影片</h2>
        <p id="dropMsg">mp3、wav、m4a、flac、mp4、webm、mov</p>
        <button class="btn primary" id="pickBtn">選擇檔案</button>
      </div></div>
    </div>
    <div id="scrubWrap" tabindex="0" role="slider" aria-label="播放位置" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="尚未載入檔案" aria-disabled="true"><canvas id="scrubCv" aria-hidden="true"></canvas></div>
    <div id="ovWrap" aria-hidden="true"><canvas id="ovCv"></canvas></div>
  </section>
  <aside id="side">
    <div class="side-hd"><h2>音高</h2><div class="pitch"><span id="noteSub" class="mono"></span><span id="noteName" class="mono"></span></div></div>
    <canvas id="specCv" role="img" aria-label="playhead 位置的頻譜，橫軸為頻率"></canvas>
    <div class="side-hd"><h2>錄製</h2><button class="btn" id="importBtn" title="載入之前存下的操作紀錄（JSON）"><svg class="i" aria-hidden="true"><use href="#i-upload-simple"/></svg>載入紀錄</button></div>
    <input type="file" id="jsonIn" accept=".json,application/json" hidden>
    <div id="takes"></div>
  </aside>
</main>
<footer>
  <span class="hint"><kbd>Space</kbd>播放</span><span class="hint"><kbd>R</kbd>錄製</span><span class="hint"><kbd>F</kbd>按住凍結</span><span class="hint"><kbd>←</kbd><kbd>→</kbd>跳 1 秒</span><span class="hint"><kbd>滾輪</kbd>縮放</span><span class="hint"><kbd>Esc</kbd>停止重播</span>

<script id="worklet" type="text/plain">
// ---- 音訊引擎：WSOLA 粒子重疊相加 ----
// playhead 位置（樣本）由主執行緒控制；每 H 個輸出樣本放一顆以 playhead 為中心的 Hann 粒子，
// 位置在 ±tol 內找與上一顆粒子「自然延續」最相像的地方，所以變速不變調，停住時會無縫凍結。
class ScrubProcessor extends AudioWorkletProcessor {
  constructor(options) {
    super();
    const o = options.processorOptions;
    const N = o.N, H = N >> 1;
    this.N = N; this.H = H; this.tol = N >> 2; this.PAD = N * 2;
    this.nch = o.channels.length; this.len = o.channels[0].length;
    const P = this.PAD, len = this.len;
    this.src = o.channels.map(c => { const a = new Float32Array(len + 2 * P); a.set(c, P); return a; });
    const m = new Float32Array(len + 2 * P);
    for (const a of this.src) for (let i = 0; i < a.length; i++) m[i] += a[i];
    if (this.nch > 1) for (let i = 0; i < m.length; i++) m[i] /= this.nch;
    this.mono = m;
    this.win = new Float32Array(N);
    for (let n = 0; n < N; n++) this.win[n] = 0.5 - 0.5 * Math.cos(2 * Math.PI * n / N);
    this.RING = N * 4;
    this.acc = []; for (let c = 0; c < this.nch; c++) this.acc.push(new Float32Array(this.RING));
    this.rp = 0; this.untilGrain = 0; this.prevStart = null; this.dirty = false;
    this.pos = o.pos || 0; this.target = this.pos;
    this.mode = 'stop'; this.rate = 1; this.freeze = true; this.still = 0;
    this.gain = 0; this.gk = 1 - Math.exp(-1 / (0.006 * sampleRate));
    // 音量：volT 是目標倍率，vol 以約 20ms 追上去（滑桿是一格一格跳的，直接套用會有顆粒雜音）
    this.vol = this.volT = this.cleanVol(o.vol); this.volK = 1 - Math.exp(-1 / (0.02 * sampleRate));
    // 變調（黑膠）模式：直接以 playhead 速度讀原音，兩級平滑讓速度連續；DC 阻隔讓停住時安靜
    this.vinyl = false; this.pendingPitch = null; this.t1 = this.pos; this.vk = 1 - Math.exp(-1 / (0.012 * sampleRate));
    this.dcx = new Float32Array(2); this.dcy = new Float32Array(2); this.dcR = 1 - 2 * Math.PI * 12 / sampleRate;
    this.frame = 0; this.lastRep = -1e9; this.rec = null;
    this.script = null; this.si = 0; this.s0 = 0;
    if (o.script) this.startScript(o.script);
    this.port.onmessage = e => this.onMsg(e.data);
  }
  onMsg(d) {
    if (d.t === 'rec') {
      if (d.on) {
        this.rec = { f0: this.frame, ev: [] };
        this.log({ t: 'init', pos: this.pos, target: this.target, mode: this.mode, rate: this.rate,
                   freeze: this.freeze, gain: this.gain, prev: this.prevStart, vinyl: this.vinyl, vol: this.volT });
      } else if (this.rec) {
        this.log({ t: 'end' });
        this.port.postMessage({ t: 'script', script: this.rec.ev });
        this.rec = null;
      }
      return;
    }
    if (d.t === 'script') { this.startScript(d.script); return; }
    if (d.t === 'abortScript') { this.script = null; this.mode = 'stop'; this.port.postMessage({ t: 'scriptEnd' }); return; }
    if (this.script) return;               // 重播中忽略使用者操作
    this.apply(d);
    if (this.rec) this.log(Object.assign({}, d));
  }
  log(d) { d.f = this.frame - this.rec.f0; this.rec.ev.push(d); }
  cleanVol(v) { return typeof v === 'number' && v >= 0 && v <= 64 ? v : 1; }   // 紀錄檔可能是外來的：不合理的值一律當成原音量
  startScript(s) { this.script = s; this.si = 0; this.s0 = this.frame; }
  switchPitch(on) {
    this.vinyl = on; this.t1 = this.target = this.pos; this.pendingPitch = null;
    for (const a of this.acc) a.fill(0); this.prevStart = null; this.untilGrain = 0;
    this.dcx.fill(0); this.dcy.fill(0);
  }
  apply(d) {
    switch (d.t) {
      case 'init': this.pos = d.pos; this.target = d.target; this.mode = d.mode; this.rate = d.rate;
                   this.freeze = d.freeze; this.gain = d.gain; this.prevStart = d.prev; this.vinyl = !!d.vinyl; this.t1 = this.pos;
                   this.vol = this.volT = this.cleanVol(d.vol); break;
      case 'mode': this.mode = d.mode; if (d.rate != null) this.rate = d.rate;
                   if (d.pos != null) this.pos = d.pos; this.target = this.t1 = this.pos; this.still = 0; break;
      case 'target': this.target = d.pos; break;
      case 'seek': this.pos = this.target = this.t1 = d.pos; break;
      case 'pitch':   // 切換時先淡出約 5ms 再換引擎，避免爆音
        if (this.vinyl === !!d.on) this.pendingPitch = null;
        else if (this.gain < 1e-3) this.switchPitch(!!d.on);
        else this.pendingPitch = !!d.on;
        break;
      case 'rate': this.rate = d.rate; break;
      case 'vol': this.volT = this.cleanVol(d.v); break;
      case 'freeze': this.freeze = d.on; break;
      case 'end': this.mode = 'stop'; break;
    }
  }
  search(target, nat) {
    const m = this.mono, P = this.PAD, L = this.H, tol = this.tol, r = P + nat;
    let re = 0; for (let k = 0; k < L; k += 4) re += m[r + k] * m[r + k];
    if (re < 1e-7) return target;
    let best = -Infinity, bd = 0;
    for (let d = -tol; d <= tol; d += 4) {          // 粗搜：位移與樣本都隔 4
      const c = P + target + d; let s = 0, e = 1e-9;
      for (let k = 0; k < L; k += 4) { const x = m[c + k]; s += x * m[r + k]; e += x * x; }
      const v = s / Math.sqrt(e); if (v > best) { best = v; bd = d; }
    }
    best = -Infinity; let fd = bd;
    for (let d = bd - 3; d <= bd + 3; d++) {         // 細搜
      if (d < -tol || d > tol) continue;
      const c = P + target + d; let s = 0, e = 1e-9;
      for (let k = 0; k < L; k++) { const x = m[c + k]; s += x * m[r + k]; e += x * x; }
      const v = s / Math.sqrt(e); if (v > best) { best = v; fd = d; }
    }
    return target + fd;
  }
  grain() {
    const N = this.N, H = this.H, len = this.len;
    let target = Math.round(this.pos) - H;
    if (target < -H) target = -H; if (target > len - H) target = len - H;
    const start = this.prevStart === null ? target : this.search(target, this.prevStart + H);
    const base = this.PAD + start, w = this.win, mask = this.RING - 1, rp = this.rp;
    for (let c = 0; c < this.nch; c++) {
      const s = this.src[c], a = this.acc[c];
      for (let n = 0; n < N; n++) a[(rp + n) & mask] += w[n] * s[base + n];
    }
    this.prevStart = start; this.dirty = true;
  }
  report() {
    if (this.frame - this.lastRep >= 512) {
      this.lastRep = this.frame;
      this.port.postMessage({ t: 'pos', pos: this.pos, mode: this.mode, rate: this.rate });
    }
  }
  process(inputs, outputs) {
    const out = outputs[0], B = out[0].length;
    if (this.script) {
      const rel = this.frame - this.s0;
      while (this.si < this.script.length && this.script[this.si].f <= rel) this.apply(this.script[this.si++]);
      if (this.si >= this.script.length) { this.script = null; this.port.postMessage({ t: 'scriptEnd' }); }
    }
    if (this.pendingPitch !== null && this.gain < 1e-3) this.switchPitch(this.pendingPitch);
    if (this.vinyl) return this.processVinyl(out, B);
    if (this.mode === 'play') {
      this.pos += this.rate * B;
      if (this.pos >= this.len) { this.pos = this.len; this.mode = 'stop'; this.port.postMessage({ t: 'ended' }); }
      this.target = this.pos;
    } else if (this.mode === 'scrub') {
      const diff = this.target - this.pos;
      if (Math.abs(diff) < 1) { this.pos = this.target; this.still += B; }
      else { this.pos += diff * 0.3; this.still = Math.abs(diff) < 8 ? this.still + B : 0; }
    }
    const quietStill = this.mode === 'scrub' && !this.freeze && this.still > 0.04 * sampleRate;

function detectPitch(x) {                  // 回傳 { f, clarity } 或 null（靜音、噪音、沒有明確週期）
  const W = AW, n = W * 2, re = an.re, im = an.im, nsdf = an.nsdf;
  let e = 0;
  for (let i = 0; i < W; i++) { re[i] = x[i]; e += x[i] * x[i]; }
  re.fill(0, W); im.fill(0);
  if (e / W < 1e-5) return null;                         // RMS 約低於 0.003 視為靜音
  fft(re, im, false);
  for (let i = 0; i < n; i++) { re[i] = re[i] * re[i] + im[i] * im[i]; im[i] = 0; }
  fft(re, im, true);                                     // re[τ] = 自相關 r(τ)
  const tauMin = Math.floor(sr / 4200), tauMax = Math.min(W / 2, Math.floor(sr / 45));
  let m = 2 * e; nsdf[0] = 1;
  for (let t = 1; t <= tauMax + 1; t++) {                // m(τ) = Σ x[j]² + x[j+τ]²，逐步扣掉兩端
    m -= x[t - 1] * x[t - 1] + x[W - t] * x[W - t];
    nsdf[t] = m > 1e-9 ? 2 * re[t] / m : 0;
  }
  const peaks = []; let maxV = 0, t = 1;
  while (t <= tauMax && nsdf[t] > 0) t++;                // 跳過 τ=0 附近的第一個正區段
  while (t <= tauMax) {                                  // 每個正區段取一個最高點
    while (t <= tauMax && nsdf[t] <= 0) t++;

    while (t <= tauMax && nsdf[t] > 0) { if (nsdf[t] > pv) { pv = nsdf[t]; pk = t; } t++; }
    if (pk >= tauMin && pk < tauMax) { peaks.push(pk); if (pv > maxV) maxV = pv; }
  }
  if (!peaks.length || maxV < 0.5) return null;
  const pk = peaks.find(q => nsdf[q] >= maxV * 0.9);     // 第一個夠高的峰 = 最短的週期，避免低八度誤判
  const a = nsdf[pk - 1], b = nsdf[pk], c = nsdf[pk + 1], d = a - 2 * b + c;
  const tau = d ? pk + 0.5 * (a - c) / d : pk;           // 拋物線內插，週期可以不是整數樣本
  return { f: sr / tau, clarity: b };
}

function spectrum(x) {                     // 結果放在 an.db（dBFS，滿刻度正弦波為 0）
  const re = an.sre, im = an.sim, w = an.win, db = an.db;
  for (let i = 0; i < AW; i++) { re[i] = x[i] * w[i]; im[i] = 0; }
  fft(re, im, false);
  for (let i = 0; i < AW / 2; i++) db[i] = 20 * Math.log10(Math.hypot(re[i], im[i]) / (AW / 4) + 1e-10);
}

function noteOf(f) {
  const m = 69 + 12 * Math.log2(f / 440), n = Math.round(m);
  return { name: NOTES[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1), cents: Math.round((m - n) * 100) };
}
function showNote(r) {
  let name = '無明確音高', sub = '';
  if (r) { const q = noteOf(r.f); name = q.name; sub = (q.cents >= 0 ? '+' : '-') + Math.abs(q.cents) + '¢  ' + r.f.toFixed(1) + ' Hz'; }
  const key = name + sub; if (key === an.text) return; an.text = key;
  el.noteName.textContent = name; el.noteName.classList.toggle('off', !r); el.noteSub.textContent = sub;
}

function drawSpectrum() {
  const cv = el.specCv, g = spg, W = cv.width, H = cv.height, d = devicePixelRatio || 1; if (!W) return;
  if (!an.disp || an.disp.length !== W) an.disp = new Float32Array(W).fill(-200);
  const fMin = 40, fMax = Math.min(12000, sr / 2), ratio = fMax / fMin, binHz = sr / AW, db = an.db, disp = an.disp;
  const top = 22 * d, lo = -90, hi = -6, xOf = f => Math.log(f / fMin) / Math.log(ratio) * W;
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  for (let x = 0; x < W; x++) {                           // 對數頻率軸：低頻在相鄰頻格間內插，高頻取範圍內最大值
    const b0 = fMin * Math.pow(ratio, x / W) / binHz, b1 = fMin * Math.pow(ratio, (x + 1) / W) / binHz;
    let v;
    if (b1 - b0 < 1) { const i = Math.floor(b0), f = b0 - i; v = db[i] * (1 - f) + db[Math.min(i + 1, db.length - 1)] * f; }
    else { v = -200; for (let i = Math.floor(b0); i < b1 && i < db.length; i++) if (db[i] > v) v = db[i]; }
    disp[x] = Math.max(v, disp[x] - 2.5);                 // 下降時每幀最多掉 2.5dB，畫面比較穩
  }
  const yOf = x => H - clamp((disp[x] - lo) / (hi - lo), 0, 1) * (H - top);
  g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x < W; x++) g.lineTo(x, yOf(x));
  g.lineTo(W, H); g.closePath(); g.fillStyle = C.played; g.fill();
  g.beginPath();
  for (let x = 0; x < W; x++) x ? g.lineTo(x, yOf(x)) : g.moveTo(x, yOf(x));
  g.strokeStyle = C.wave; g.lineWidth = d; g.stroke();
  g.font = `${13 * d}px "Fragment Mono", ui-monospace, monospace`; g.textBaseline = 'top';
  for (let oct = 2; oct <= 8; oct++) {                    // 每個八度的 C 一條格線
    const f = 440 * Math.pow(2, (12 * (oct + 1) - 69) / 12); if (f > fMax) break;
    const x = Math.round(xOf(f));
    g.fillStyle = C.line; g.fillRect(x, 0, 1, H);
    g.fillStyle = C.muted; g.fillText('C' + oct, x + 4 * d, 4 * d);
  }
  if (an.f0 >= fMin && an.f0 <= fMax) { g.fillStyle = C.accentStrong; g.fillRect(Math.round(xOf(an.f0)) - d / 2, top, Math.max(1, d), H - top); }
}

function analyze(p) {
  const s0 = Math.round(p * sr) - AW / 2, moved = s0 !== an.lastS;
  if (!moved && an.settle <= 0) return;                   // 位置沒變、畫面也穩定了就不重算
  if (moved) {
    an.lastS = s0; an.settle = 40;
    const x = an.x, n = mono.length;
    for (let i = 0; i < AW; i++) { const k = s0 + i; x[i] = k >= 0 && k < n ? mono[k] : 0; }
    const r = detectPitch(x); an.f0 = r ? r.f : 0;
    spectrum(x); showNote(r);
  } else an.settle--;
  drawSpectrum();
}

function loop() {
  requestAnimationFrame(loop);
  if (!mono) { if (!loop.blank) { drawScrub(0); loop.blank = true; } return; }
  loop.blank = false;
  const p = estPos();
  // 位置、縮放、尺寸、顏色都沒變就不重畫（錄製中例外）
  const key = p + '|' + zoom + '|' + el.scrubCv.width + 'x' + el.scrubCv.height + '|' + themeV + '|' + ovV;
  if (key !== loop.key || recorder) { loop.key = key; drawScrub(p); drawOverview(p); }
  analyze(p);
  const av = Math.round(p * 10) / 10;       // 刷動區的滑桿數值，每 0.1 秒更新一次
  if (av !== loop.av) { loop.av = av; el.scrubWrap.setAttribute('aria-valuenow', av); el.scrubWrap.setAttribute('aria-valuetext', `${fmtShort(p)}，全長 ${fmtShort(dur)}`); }
  if (hasVideo) drawStage(p);
  const ct = fmt(p);
  if (ct !== loop.ct) { loop.ct = ct; el.clock.firstChild.nodeValue = ct + ' '; }
  let m = '', cls = '';
  if (recorder) { m = '錄製中 ' + fmtShort((performance.now() - recT0) / 1000); cls = 'rec'; }
  else if (st.replaying) { m = '重播 ' + st.replaying.name; cls = 'busy'; }
  else if (hasVideo && !fc.done && fc.vid) m = `影格快取 ${Math.floor(fc.scanT / dur * 100)}%`;
  else if (st.dragging) m = '刷動中';
  else if (lock.active) m = `游標 ${Math.max(1, Math.ceil((lock.holdMs - (performance.now() - lock.t0)) / 1000))} 秒後恢復`;
  if (m !== loop.m) { loop.m = m; el.meter.textContent = m; el.meter.className = 'mono ' + cls; }
}

// ---------- 錄製 ----------
function pickMime() {
  return ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']
    .find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
}
function startRec() {
  if (!node || st.replaying || recorder) return;
  const cv = hasVideo ? el.stageCv : el.scrubCv, mimeType = pickMime();
  try {
    const vs = cv.captureStream(30);
    recStream = new MediaStream([...vs.getVideoTracks(), ...recDest.stream.getAudioTracks()]);
    recorder = new MediaRecorder(recStream, { mimeType, videoBitsPerSecond: 8e6, audioBitsPerSecond: 256000 });
  } catch (e) {                              // 瀏覽器不能錄影：照樣記錄操作，之後仍可重播與匯出 WAV
    console.error(e); recStream = null;
    recorder = { mimeType: '', start() {}, stop() { this.onstop && this.onstop(); } };
    status('這個瀏覽器不支援錄影，這段只會記錄操作', 5000);
  }
  recChunks = [];
  recorder.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
  const stopped = new Promise(r => recorder.onstop = r);
  const scriptP = new Promise(r => scriptResolve = r);
  const rec = recorder;
  Promise.all([stopped, scriptP]).then(([, script]) => {
    const type = rec.mimeType || mimeType || 'video/webm';
    addTake({ script, sr, N, fileName, dur, blob: recChunks.length ? new Blob(recChunks, { type }) : null });
  });
  recorder.start(500);
  send({ t:'rec', on:true });
  recT0 = performance.now();
  el.rec.innerHTML = icon('stop') + '<span>停止錄製</span>'; say('開始錄製');
  updUI();
}
function stopRec() {
  if (!recorder) return;
  send({ t:'rec', on:false });
  recorder.stop();
  if (recStream) recStream.getVideoTracks().forEach(t => t.stop());
  recorder = null;
  el.rec.innerHTML = icon('record-fill') + '<span>錄製</span>';
  updUI();
}
el.rec.onclick = () => recorder ? stopRec() : startRec();

// ---------- 錄製紀錄 ----------
function addTake(t) {
  t.id = ++takeSeq; t.name = 'Take ' + t.id;
  t.frames = t.script.length ? t.script[t.script.length - 1].f : 0;
  takes.unshift(t); renderTakes();
  say(`已新增 ${t.name}，長度 ${fmtShort(t.frames / t.sr)}`);
}
function trajectory(t) {
  // 由事件模擬 playhead：回傳 [秒, 位置秒] 折線
  let pos = 0, target = 0, mode = 'stop', rate = 1, lastF = 0; const pts = [];
  const lenS = t.dur * t.sr;
  for (const e of t.script) {
    const dt = e.f - lastF;
    if (mode === 'play') pos = Math.min(lenS, pos + rate * dt); else if (mode === 'scrub') pos = target;
    pts.push([e.f, pos]);
    switch (e.t) {
      case 'init': pos = e.pos; target = e.target; mode = e.mode; rate = e.rate; break;
      case 'mode': mode = e.mode; if (e.rate != null) rate = e.rate; if (e.pos != null) pos = e.pos; target = pos; break;
      case 'target': target = e.pos; break;
      case 'seek': pos = target = e.pos; break;
      case 'rate': rate = e.rate; break;
    }
    pts.push([e.f, pos]); lastF = e.f;
  }
  return pts;
}
function drawTraj(cv, t) {
  const d = devicePixelRatio || 1; cv.width = cv.clientWidth * d || 260 * d; cv.height = 46 * d;
  const g = cv.getContext('2d'), W = cv.width, H = cv.height, pts = trajectory(t);
  const F = Math.max(1, t.frames), L = Math.max(1, t.dur * t.sr), pad = 4 * d;
  g.fillStyle = C.surface; g.fillRect(0, 0, W, H);
  g.strokeStyle = C.accentStrong; g.lineWidth = 1.5 * d; g.lineJoin = 'round'; g.beginPath();
  pts.forEach(([f, p], i) => { const x = f / F * W, y = H - pad - p / L * (H - 2 * pad); i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.stroke();
}
function renderTakes() {
  el.takes.innerHTML = '';
  if (!takes.length) { el.takes.innerHTML = '<div class="none">尚無錄製</div>'; return; }
  for (const t of takes) {
    const div = document.createElement('div'); div.className = 'take' + (st.replaying === t ? ' active' : '');
    const ext = t.blob ? (t.blob.type.includes('mp4') ? 'mp4' : 'webm') : '';
    div.innerHTML = `<div class="hd"><b>${t.name}</b><span class="mono">${fmtShort(t.frames / t.sr)}s</span></div>
      <canvas role="img" aria-label="${t.name} 的拖移軌跡" title="軌跡：橫軸是錄製時間，縱軸是 playhead 在原檔裡的位置"></canvas>
      <div class="btns">
        <div class="row">
          <button class="btn" data-a="replay" title="重播這段操作">${st.replaying === t ? icon('stop') + '停止重播' : icon('arrow-counter-clockwise') + '重播'}</button>
          <button class="btn icon del" data-a="del" title="刪除" aria-label="刪除 ${t.name}">${icon('x')}</button>
        </div>
        <div class="row"><div class="dl" role="group" aria-label="下載 ${t.name}"><span>${icon('download-simple')}下載</span>${t.blob ? `<button data-a="video" title="下載錄下的影音">${ext.toUpperCase()}</button>` : ''}<button data-a="wav" title="依軌跡重新計算並下載 WAV">WAV</button><button data-a="json" title="下載操作紀錄">JSON</button></div></div>
      </div>`;
    el.takes.appendChild(div);
    requestAnimationFrame(() => drawTraj(div.querySelector('canvas'), t));
    div.querySelector('.btns').onclick = e => {
      const a = e.target.closest('button')?.dataset.a; if (!a) return;
      if (a === 'replay') st.replaying === t ? send({ t:'abortScript' }) : replay(t);
      if (a === 'video') download(t.blob, `${baseName()}_${t.name.replace(' ', '')}.${ext}`);
      if (a === 'wav') exportWav(t, e.target.closest('button'));
      if (a === 'json') download(new Blob([JSON.stringify({ app:'ytpoop-scrubber', version:1, fileName:t.fileName, dur:t.dur, sr:t.sr, N:t.N, script:t.script })], { type:'application/json' }), `${baseName()}_${t.name.replace(' ', '')}.json`);
      if (a === 'del') { if (st.replaying === t) send({ t:'abortScript' }); takes.splice(takes.indexOf(t), 1); renderTakes(); }
    };
  }
}
function checkTake(t) {
  if (!node) { status('先載入原本的檔案', 4000); return false; }
  if (Math.abs(t.dur - dur) > 0.05) status(`注意：這段紀錄是用「${t.fileName}」錄的，長度不同`, 5000);
  return true;
}
function replay(t) {
  if (!checkTake(t) || recorder) return;
  if (st.dragging) endDrag();
  if (t.N !== N) { N = t.N; markGrain(); buildNode(st.pos * sr); }
  st.playing = false; st.replaying = t;
  send({ t:'script', script: t.script });
  renderTakes(); updUI(); say('開始重播 ' + t.name);
}
async function exportWav(t, btn) {
  if (!checkTake(t)) return;
  const old = btn.innerHTML; btn.textContent = '計算中'; btn.disabled = true;
  try {
    const oc = new OfflineAudioContext(channels.length, t.frames + t.N * 2 + 256, sr);
    await oc.audioWorklet.addModule(workletURL);
    const n = new AudioWorkletNode(oc, 'scrub', { numberOfInputs:0, numberOfOutputs:1, outputChannelCount:[channels.length],
      processorOptions: { channels, N: t.N, pos: 0, script: t.script } });
    n.connect(oc.destination);
    const out = await oc.startRendering();
    download(encodeWav(out), `${baseName()}_${t.name.replace(' ', '')}.wav`);
  } catch (e) { console.error(e); status('匯出失敗：' + e.message, 5000); }
  btn.innerHTML = old; btn.disabled = false;
}
function encodeWav(ab) {
  const nch = ab.numberOfChannels, len = ab.length, bytes = 44 + len * nch * 2;
  const v = new DataView(new ArrayBuffer(bytes));
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, bytes - 8, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, nch, true); v.setUint32(24, ab.sampleRate, true);
  v.setUint32(28, ab.sampleRate * nch * 2, true); v.setUint16(32, nch * 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, len * nch * 2, true);
  const chs = []; for (let c = 0; c < nch; c++) chs.push(ab.getChannelData(c));
  let o = 44;
  for (let i = 0; i < len; i++) for (let c = 0; c < nch; c++) { const s = clamp(chs[c][i], -1, 1); v.setInt16(o, s < 0 ? s * 32768 : s * 32767, true); o += 2; }
  return new Blob([v], { type:'audio/wav' });
}
function scaleScript(script, k) {
  return script.map(e => { const o = Object.assign({}, e); o.f = Math.round(e.f * k); for (const key of ['pos', 'target', 'prev']) if (o[key] != null) o[key] *= k; return o; });
}
el.importBtn.onclick = () => el.jsonIn.click();
el.jsonIn.onchange = async () => {
  const f = el.jsonIn.files[0]; el.jsonIn.value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (!Array.isArray(j.script)) throw new Error('不是 YTPoop Scrubber 的紀錄檔');
    const k = ctx ? sr / j.sr : 1;
    addTake({ script: k === 1 ? j.script : scaleScript(j.script, k), sr: k === 1 ? j.sr : sr, N: j.N || 2048, fileName: j.fileName || '?', dur: j.dur || 0, blob: null });
    takes[0].name += '（匯入）'; renderTakes();
  } catch (e) { status('讀取失敗：' + e.message, 5000); }
};

// ---------- 檔案 / 鍵盤 ----------
el.open.onclick = el.pick.onclick = () => el.fileIn.click();
el.fileIn.onchange = () => { const f = el.fileIn.files[0]; el.fileIn.value = ''; if (f) loadFile(f); };
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragover'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragover'); });
addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('dragover'); const f = e.dataTransfer.files[0]; if (f) loadFile(f); });
// 鍵盤刷動：和滑鼠拖曳共用同一套引擎狀態（drag.kind = 'kbd'）
const kb = { hold: false, timer: 0 };
function kbStart() {
  if (!node || st.replaying) return false;
  if (st.dragging) return drag.kind === 'kbd';
  const now = estPos();
  st.dragging = true; drag.kind = 'kbd'; st.dragTarget = now;
  send({ t:'mode', mode:'scrub' });
  return true;
}
function kbEnd() { clearTimeout(kb.timer); if (st.dragging && drag.kind === 'kbd' && !kb.hold) endDrag(); }
function kbNudge(dt) {
  if (!kbStart()) return;
  const t = clamp(st.dragTarget + dt, 0, dur);
  st.dragTarget = t; lastMoveT = performance.now(); send({ t:'target', pos: t * sr });
  clearTimeout(kb.timer); kb.timer = setTimeout(kbEnd, 450);       // 放開按鍵 0.45 秒後結束刷動
}
addEventListener('keydown', e => {
  const t = e.target, tag = t.tagName;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if ((tag === 'INPUT' && t.type !== 'range' && t.type !== 'checkbox') || tag === 'TEXTAREA' || t.isContentEditable) return;
  // 焦點在按鈕、開關、滑桿、選項上時，空白鍵和方向鍵留給那個控制項自己用
  const onSlider = t === el.scrubWrap, onControl = !onSlider && !!(t.closest && t.closest('button, input, select, a, [role=radio]'));
  if (onSlider && node && !st.replaying) {   // 刷動區：方向鍵細刷（聽得到聲音），Shift 加大十倍，PageUp/Down 跳 5 秒
    const fine = zoom / 100, k = e.code;
    const dt = k === 'ArrowLeft' || k === 'ArrowDown' ? -fine : k === 'ArrowRight' || k === 'ArrowUp' ? fine : k === 'PageDown' ? -5 : k === 'PageUp' ? 5 : 0;
    if (dt) { e.preventDefault(); kbNudge(Math.abs(dt) < 5 && e.shiftKey ? dt * 10 : dt); return; }
    if (k === 'Home' || k === 'End') { e.preventDefault(); kbEnd(); seek(k === 'Home' ? 0 : dur); return; }
  }
  if (e.code === 'Space') { if (onControl) return; e.preventDefault(); togglePlay(); }
  else if (e.code === 'KeyR') { recorder ? stopRec() : startRec(); }
  else if (e.code === 'KeyF') { if (!e.repeat && !kb.hold && kbStart()) kb.hold = true; }   // 按住 F：凍結在目前位置
  else if (e.code === 'Escape' && st.replaying) send({ t:'abortScript' });
  else if ((e.code === 'ArrowLeft' || e.code === 'ArrowRight') && !onControl && node && !st.replaying && !st.dragging) {
    e.preventDefault(); seek(estPos() + (e.code === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 5 : 1));
  }
});
addEventListener('keyup', e => { if (e.code === 'KeyF' && kb.hold) { kb.hold = false; kbEnd(); } });
addEventListener('blur', () => { kb.hold = false; if (st.dragging) endDrag(); });   // 切走視窗時結束任何刷動
el.vid.addEventListener('loadedmetadata', layout);

if (/[?&]debug\b/.test(location.search)) window.app = { loadFile, st, takes, fc, an, lock, jumpLog, vol, setVol, detectPitch, noteOf, AW, get node() { return node; }, get ctx() { return ctx; }, encodeWav, get workletURL() { return workletURL; }, get channels() { return channels; } };
applyTheme(); markGrain(); layout(); renderTakes(); updUI(); loop();
</script>
